name: Build Android APK (arm64)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Liberar almacenamiento (solo software preinstalado del runner)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
                      /usr/local/share/boost /usr/share/swift \
                      /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Swap de 4 GB
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 4G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar llama.cpp
        run: |
          rm -rf app/src/main/cpp/llama.cpp
          git clone --depth 1 https://github.com/ggerganov/llama.cpp app/src/main/cpp/llama.cpp
          git -C app/src/main/cpp/llama.cpp log -1 --format='llama.cpp: %h %cd'

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: NDK, CMake y plataforma (el SDK ya viene en el runner)
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;26.1.10909125" "cmake;3.22.1" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK debug
        run: |
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            -x lintDebug \
            -x testDebugUnitTest
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.parallel=true"
          
      - name: Comprobar que solo hay arm64
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          unzip -l "$APK" | grep "lib/" || true
          if unzip -l "$APK" | grep -qE "lib/(armeabi-v7a|x86|x86_64)/"; then
            echo "::warning::El APK trae otras arquitecturas además de arm64-v8a"
          fi

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: LocalMind-debug-arm64
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Subir logs de CMake si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-logs
          path: |
            app/.cxx/**/*.txt
            app/.cxx/**/*.log
          if-no-files-found: ignore
